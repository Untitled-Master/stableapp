name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Development build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          body: |
            ## Which file do I download?
            - **StableApp Setup *.exe** — the installer (recommended). Installs StableApp with Start Menu + desktop shortcuts and an uninstaller.
            - **StableApp *.exe** — the portable build. Runs without installing; keep it anywhere and double-click.

            > Both files are the same app, just packaged differently. The exes are unsigned, so Windows SmartScreen will ask for confirmation on first run.
          files: release/*.exe
          fail_on_unmatched_files: true
